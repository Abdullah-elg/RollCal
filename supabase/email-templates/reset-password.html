<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#F6F4EE;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F4EE;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFEFA;border:1px solid #E2DFD5;border-radius:12px;">
        <tr><td style="padding:28px 28px 0 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td style="background:#1F5C4A;border-radius:8px;width:32px;height:32px;" width="32" height="32"></td>
            <td style="padding-left:10px;font-size:18px;font-weight:700;color:#161A17;">RollCal</td>
          </tr></table>
        </td></tr>
        <tr><td style="padding:24px 28px 28px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#161A17;">
          <h1 style="margin:0 0 8px 0;font-size:22px;line-height:1.3;font-weight:700;">Reset your password</h1>
          <p style="margin:0 0 20px 0;font-size:15px;line-height:1.55;color:#636A62;">Enter this code in RollCal to choose a new password.</p>
          <div style="font-family:'SF Mono',Menlo,Consolas,monospace;font-size:34px;font-weight:600;letter-spacing:8px;color:#161A17;background:#F6F4EE;border:1px solid #E2DFD5;border-radius:8px;padding:16px 0;text-align:center;">{{ .Token }}</div>
          <p style="margin:24px 0 0 0;font-size:13px;line-height:1.5;color:#636A62;">If you didn&rsquo;t ask to reset your password, you can ignore this email. Your password won&rsquo;t change.</p>
        </td></tr>
      </table>
      <p style="margin:16px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#8A9088;">
        RollCal &middot; <a href="https://rollcal.app" style="color:#8A9088;">rollcal.app</a> &middot; <a href="mailto:support@rollcal.app" style="color:#8A9088;">support@rollcal.app</a>
      </p>
    </td></tr>
  </table>
</body>
</html>
