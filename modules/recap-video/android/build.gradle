plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.rollcal'
version = '1.0.0'

android {
  namespace "expo.modules.recapvideo"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Turning photos upright (EXIF), as expo-image-picker does.
  implementation 'androidx.exifinterface:exifinterface:1.4.1'
}
